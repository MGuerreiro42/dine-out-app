version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Expo/RN packages are version-locked to the SDK; let `npx expo install --fix`
      # manage these deliberately instead of Dependabot bumping them independently.
      - dependency-name: 'expo*'
      - dependency-name: 'react-native*'
      - dependency-name: '@expo/*'
      - dependency-name: '@react-native*'
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: jest-expo
      # Native module: needs a native rebuild and device check, bumped deliberately.
      - dependency-name: '@maplibre/*'
      # jest-expo depends on Jest 29 internals; majors move with the Expo SDK.
      - dependency-name: jest
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      # nativewind v4 / react-native-css-interop require tailwindcss v3.
      - dependency-name: nativewind
        update-types: ['version-update:semver-major']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
