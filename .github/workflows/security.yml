name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Fails only on high+ severity: this dependency tree (RN/Expo tooling) tends to
      # carry moderate-severity advisories in transitive dev dependencies with no fix
      # published yet, which would otherwise make this check permanently red.
      - run: npm audit --audit-level=high
