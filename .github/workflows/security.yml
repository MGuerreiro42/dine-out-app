name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Non-blocking: the current tree carries high-severity advisories rooted in
      # Metro (react-native/expo's build-time bundler — dev tooling, never shipped to
      # the app runtime), with no patched version published yet. Reviewed manually
      # per run rather than gating merges on an issue nobody can currently fix.
      - run: npm audit --audit-level=high
        continue-on-error: true
