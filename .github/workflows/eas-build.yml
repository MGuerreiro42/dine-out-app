name: EAS Build

# Manual trigger only — never runs on push/PR. EAS Build's free tier is capped at
# 15 Android + 15 iOS builds/month; this workflow exists so a build can be kicked
# off from GitHub when it's actually wanted, not automatically on every merge.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'eas.json build profile'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Target platform'
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  build:
    name: EAS Build (${{ inputs.profile }} / ${{ inputs.platform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive --no-wait
